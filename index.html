<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<title>Buku Kasbon Karyawan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f9;--sf:#fff;--tx:#141a30;--mu:#68718f;--ac:#23346f;--onac:#fff;--acs:#eceffa;--bd:#e3e6f0;--ok:#12805a;--bad:#c23b3b;--sh:0 1px 2px rgba(20,26,48,.05),0 6px 20px rgba(20,26,48,.05)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d111f;--sf:#161b2e;--tx:#e8ebf7;--mu:#98a1c0;--ac:#8fa4ff;--onac:#0d111f;--acs:#1e2540;--bd:#262d47;--ok:#4cd0a0;--bad:#ff8585;--sh:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d111f;--sf:#161b2e;--tx:#e8ebf7;--mu:#98a1c0;--ac:#8fa4ff;--onac:#0d111f;--acs:#1e2540;--bd:#262d47;--ok:#4cd0a0;--bad:#ff8585;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 "Plus Jakarta Sans","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header>div:last-child{display:flex;gap:8px;flex-wrap:wrap}
.bl{display:flex;align-items:center;gap:14px}
.logo{height:54px;width:auto;border-radius:8px;background:#fff;padding:3px}
.site{display:inline-block;font-size:12px;font-weight:600;color:var(--ac);background:var(--acs);border-radius:999px;padding:2px 11px;margin-bottom:8px}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
header p{margin:0;font-size:13px;color:var(--mu)}
main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;padding:24px 20px;max-width:1280px;margin:auto;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr;padding:16px 12px}header{padding:12px 14px}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:var(--sh)}
h2{font-size:15px;font-weight:700;margin:0 0 12px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mu);margin:12px 0 5px}
input,select,textarea{width:100%;height:40px;padding:0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;transition:border-color .15s,box-shadow .15s}
textarea{height:auto;padding:10px 12px}
input:hover,select:hover{border-color:var(--mu)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
button{font:inherit;font-weight:600;cursor:pointer;height:40px;border:1px solid var(--ac);background:var(--ac);color:var(--onac);border-radius:10px;padding:0 16px;margin-top:16px;transition:filter .15s,transform .05s,background .15s}
button:hover{filter:brightness(1.12)}button:active{transform:translateY(1px)}
button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--acs),0 0 0 4px var(--ac)}
button.g,header button{background:transparent;color:var(--ac);border-color:var(--bd);margin:0}
button.g:hover,header button:hover{background:var(--acs);filter:none}
button.g{margin-top:16px}
button.x{height:30px;margin:0;padding:0 11px;font-size:12.5px;background:transparent;border-color:var(--bd);color:var(--bad)}
button.x:hover{background:var(--acs);filter:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;grid-column:1/-1}
@media(max-width:860px){.stats{grid-template-columns:1fr 1fr}}
.stat{padding:16px 18px}
.stat span{font-size:12.5px;color:var(--mu);display:block;margin-bottom:2px}
.stat b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.stat:nth-child(3){background:var(--ac);border-color:var(--ac)}
.stat:nth-child(3) span,.stat:nth-child(3) b{color:var(--onac)}.stat:nth-child(3) span{opacity:.75}
.f{display:grid;grid-template-columns:1fr 112px;gap:8px}
.emp{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid transparent;border-radius:12px;margin-top:4px;cursor:pointer;transition:background .15s,border-color .15s}
.emp:hover{background:var(--bg)}
.emp.on{background:var(--acs);border-color:var(--ac)}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-style:normal;font-weight:700}
.emp.on .av{background:var(--ac);color:var(--onac)}
.emp .nm{flex:1;min-width:0;font-weight:600}
.emp small{color:var(--mu);display:block;font-weight:400;font-size:12.5px}
.emp b.s{white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}
.addf{width:min(100%,360px)}.emp.off{opacity:.62}.emp.off .av{filter:grayscale(1)}.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--mu);background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:1px 10px;margin-left:6px}.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hd h2{margin:0}.mw{position:relative}.dots{width:36px;padding:0;margin:0!important;font-size:20px;line-height:1}.menu{position:absolute;right:0;top:44px;z-index:5;min-width:170px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 24px rgba(20,26,48,.14);padding:6px;display:flex;flex-direction:column}.menu[hidden]{display:none}.menu button{margin:0;height:36px;text-align:left;background:transparent;color:var(--tx);border:0;border-radius:8px;font-weight:500}.menu button:hover{background:var(--acs);filter:none}.menu .dn{color:var(--bad)}.pn{border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:16px;background:var(--bg)}.pn.warn{border-color:var(--bad)}.pn p{margin:4px 0 0;color:var(--mu)}.dn2{background:#c23b3b;border-color:#c23b3b;color:#fff;margin-top:12px}
#list{margin:10px -4px 0;max-height:340px;overflow:auto}
.info{display:grid;grid-template-columns:190px 1fr;margin-bottom:18px;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.info div{padding:9px 14px;border-bottom:1px solid var(--bd)}
.info div:nth-child(odd){color:var(--tx);background:var(--bg);font-weight:600}.info div:nth-child(even){font-weight:700}
.info div:nth-last-child(-n+2){border-bottom:0}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--bd)}
thead th{background:var(--ac);color:var(--onac);font-size:13px;font-weight:700;text-align:center;border:1px solid rgba(255,255,255,.3);padding:12px 14px}
tbody tr{transition:background .12s}tbody tr:hover{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody td:nth-child(4){color:var(--bad)}tbody td:nth-child(5){color:var(--ok)}
.c{text-align:center}
tr.v td{color:var(--mu)!important;text-decoration:line-through}tr.v td.a{text-decoration:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.msg{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.k{color:var(--bad)}.p{color:var(--ok)}.mu{color:var(--mu);font-size:12px}
.empty{color:var(--mu);padding:26px;text-align:center}
#detail>.card{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{:root:root:root{color-scheme:light;--bg:#fff;--sf:#fff;--tx:#000;--mu:#333;--ac:#000;--onac:#fff;--acs:#fff;--bd:#000;--ok:#0a6b48;--bad:#a52020}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}header{border:0;padding:0 0 14px}header>div:last-child{display:none}.site{font-size:15px;font-weight:700;color:#000;background:none;border:1.5px solid #000;padding:3px 14px}.side,form,.stats,.a,.noprint,#bk,.mw,.pn{display:none!important}main{display:block;padding:0}.card{box-shadow:none;border:0;padding:0;animation:none}.info,.wrap{border:1px solid #000;overflow:visible}.info div{border-bottom:1px solid #000}.info div:nth-child(odd){background:#eee}table{min-width:0;font-size:13px}th,td{border:1px solid #000;padding:7px 9px}thead th{background:#ddd;color:#000}}
</style>
</head>

function save(){try{localStorage.setItem(KEY,JSON.stringify({E:E,T:T}))}catch(e){}}
try{var r2=localStorage.getItem(KEY),r1=localStorage.getItem("kasbon-karyawan-v1");
  if(r2){var d=JSON.parse(r2);E=d.E||[];T=d.T||[]}
  else if(r1){JSON.parse(r1).emps.forEach(function(o){E.push({id:o.id,nama:o.nama,posisi:o.posisi,join:o.join});o.tx.forEach(function(t,j){T.push({id:t.id,emp:o.id,tgl:t.tgl,rin:t.rin,tipe:t.tipe,nom:t.nom,ket:t.ket,at:j,void:false})})});save()}}catch(e){}
function txOf(id){return T.filter(function(t){return t.emp===id}).sort(function(a,b){return a.tgl<b.tgl?-1:a.tgl>b.tgl?1:a.at-b.at})}
function sisa(id){return txOf(id).reduce(function(a,t){return t.void?a:a+(t.tipe==="kasbon"?t.nom:-t.nom)},0)}
function total(tipe){return T.reduce(function(a,t){return a+(!t.void&&t.tipe===tipe?t.nom:0)},0)}
function panel(e,n){
  if(editId===e.id)return'<form id="ef" class="pn"><div class="row2"><div><label for="en">Nama</label><input id="en" value="'+esc(e.nama)+'"></div><div><label for="ep">Posisi</label><input id="ep" value="'+esc(e.posisi)+'"></div></div><button type="submit">Simpan perubahan</button> <button type="button" class="g" id="ec">Batal</button><div class="msg" id="m3"></div></form>';
  if(delId===e.id)return'<div class="pn warn"><b>Hapus '+esc(e.nama)+'?</b><p>'+(n?'Semua '+n+' transaksi kasbonnya ikut terhapus dan tidak bisa dikembalikan. Sebaiknya ekspor CSV dulu.':'Data karyawan ini akan dihapus permanen.')+'</p><button type="button" id="dy" class="dn2">Ya, hapus</button> <button type="button" class="g" id="dn">Batal</button></div>';
  return""}
function render(){
  var tk=total("kasbon"),tp=total("potongan"),open=E.filter(function(e){return sisa(e.id)>0}).length;
  $("stats").innerHTML=[["Total kasbon",rp(tk)],["Total potongan",rp(tp)],["Sisa kasbon",rp(tk-tp)],["Karyawan belum lunas",open+" dari "+E.length]].map(function(s){return'<div class="card stat"><span>'+s[0]+'</span><b>'+s[1]+'</b></div>'}).join("");
  var q=$("q").value.toLowerCase(),fs=$("fs").value;
  var L=E.filter(function(e){var s=sisa(e.id);return(e.nama+" "+e.posisi).toLowerCase().indexOf(q)>=0&&(!fs||(fs==="n"?!!e.off:fs==="b"?s>0:s<=0))}).sort(function(a,b){return(!!a.off-!!b.off)||a.nama.localeCompare(b.nama)});
  $("list").innerHTML=L.length?L.map(function(e){var s=sisa(e.id);return'<div class="emp'+(e.id===sel?' on':'')+(e.off?' off':'')+'" data-id="'+e.id+'"><i class="av">'+esc(e.nama.charAt(0).toUpperCase())+'</i><span class="nm">'+esc(e.nama)+'<small>'+esc(e.posisi)+(e.off?' &middot; Nonaktif':'')+'</small></span><b class="s '+(s>0?'k':'p')+'">'+(s>0?rp(s):"Lunas")+'</b></div>'}).join(""):'<div class="empty">'+(E.length?"Tidak ada yang cocok.":"Belum ada karyawan. Tambahkan di bawah.")+'</div>';
  var e=E.filter(function(x){return x.id===sel})[0],D=$("detail");
  if(!e){D.innerHTML='<div class="card empty">Pilih karyawan untuk melihat buku kasbonnya.</div>';return}
  var run=0,tx=txOf(e.id),n=0;
  var rows=tx.map(function(t){
    if(!t.void)run+=t.tipe==="kasbon"?t.nom:-t.nom;
    return'<tr class="'+(t.void?'v':'')+'"><td class="c">'+(t.void?"-":++n)+'</td><td class="c">'+tgl(t.tgl)+'</td><td>'+esc(t.rin)+(t.void?'<div class="mu">Dibatalkan</div>':'')+'</td><td class="n">'+(t.tipe==="kasbon"?rp(t.nom):"")+'</td><td class="n">'+(t.tipe==="potongan"?rp(t.nom):"")+'</td><td class="n">'+(t.void?"":"<b>"+rp(run)+"</b>")+'</td><td class="a"><button class="x" data-v="'+t.id+'">'+(t.void?"Pulihkan":"Batalkan")+'</button></td></tr>'}).join("");
  var s=sisa(e.id);
  D.innerHTML='<div class="card"><div class="hd"><h2>Buku kasbon karyawan</h2><div class="mw"><button type="button" class="g dots" id="dots" aria-label="Menu karyawan" aria-haspopup="true">&#8942;</button><div class="menu" id="menu" hidden><button type="button" id="mEdit">Edit karyawan</button><button type="button" id="mOff">'+(e.off?'Aktifkan kembali':'Nonaktifkan karyawan')+'</button><button type="button" id="mDel" class="dn">Hapus karyawan</button></div></div></div>'+panel(e,tx.length)+'<div class="info"><div>Nama</div><div>'+esc(e.nama)+'</div><div>Posisi</div><div>'+esc(e.posisi)+'</div><div>Status</div><div><b class="'+(s>0?'k':'p')+'">'+(s>0?"Belum lunas, sisa "+rp(s):"Lunas")+'</b>'+(e.off?' <span class="tag">Nonaktif</span>':'')+'</div></div>'+
  '<div class="wrap"><table><thead><tr><th rowspan="2">No</th><th rowspan="2">Tanggal</th><th rowspan="2">Rincian</th><th colspan="3">Nominal</th><th rowspan="2" class="a"></th></tr><tr><th>Kasbon</th><th>Potongan</th><th>Sisa kasbon</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="empty">Belum ada transaksi.</td></tr>')+'</tbody></table></div>'+
  '<form id="tf"><h2 style="margin-top:16px">Catat transaksi</h2><div class="row2"><div><label for="tt">Jenis</label><select id="tt"><option value="kasbon">Kasbon baru</option><option value="potongan">Potongan (cicilan)</option></select></div><div><label for="td">Tanggal</label><input id="td" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div><label for="tr">Rincian</label><input id="tr" placeholder="Contoh: Untuk beli HP"></div><div><label for="tn">Nominal (Rp)</label><input id="tn" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></div></div><button type="submit">Simpan transaksi</button> <button type="button" class="g" id="pr">Cetak</button><div class="msg" id="m2"></div></form></div>';
  $("pr").onclick=function(){window.print()};
  $("tn").oninput=function(){var v=this.value,p=this.selectionStart,d=v.slice(0,p).replace(/\D/g,"").length,s=v.replace(/\D/g,"").replace(/^0+/,"").replace(/\B(?=(\d{3})+(?!\d))/g,".");this.value=s;var i=0,c=0;while(i<s.length&&c<d){if(s[i]!==".")c++;i++}this.setSelectionRange(i,i)};
  
  $("dots").onclick=function(ev){ev.stopPropagation();$("menu").hidden=!$("menu").hidden};
  $("mEdit").onclick=function(){editId=e.id;delId=null;render()};
  $("mDel").onclick=function(){delId=e.id;editId=null;render()};
  $("mOff").onclick=function(){e.off=!e.off;save();render()};
  if($("ec"))$("ec").onclick=function(){editId=null;render()};
  if($("dn"))$("dn").onclick=function(){delId=null;render()};
  if($("dy"))$("dy").onclick=function(){E=E.filter(function(x){return x.id!==e.id});T=T.filter(function(t){return t.emp!==e.id});sel=null;delId=null;save();render()};
  if($("ef"))$("ef").onsubmit=function(ev){ev.preventDefault();var n=$("en").value.trim();if(!n){$("m3").textContent="Nama wajib diisi.";return}
    e.nama=n;e.posisi=$("ep").value.trim();editId=null;save();render()};
  $("tf").onsubmit=function(ev){ev.preventDefault();
    var tipe=$("tt").value,nom=parseInt($("tn").value.replace(/\D/g,""),10),m=$("m2");
    if(!$("td").value||!$("tr").value.trim()||!(nom>0)){m.textContent="Isi tanggal, rincian, dan nominal lebih dari 0.";return}
    if(tipe==="potongan"&&nom>sisa(e.id)){m.textContent="Potongan melebihi sisa kasbon ("+rp(sisa(e.id))+").";return}
    T.push({id:uid(),emp:e.id,tgl:$("td").value,rin:$("tr").value.trim(),tipe:tipe,nom:nom,at:Date.now(),void:false});save();render()};
}
function csvCell(v){return'"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
async function exportCsv(onlyId){
  var r=[["Karyawan","Posisi","No","Tanggal","Rincian","Kasbon","Potongan","Sisa Kasbon","Status"]];
  E.slice().sort(function(a,b){return a.nama.localeCompare(b.nama)}).forEach(function(e){
    if(onlyId&&e.id!==onlyId)return;var run=0,n=0;
    txOf(e.id).forEach(function(t){if(!t.void)run+=t.tipe==="kasbon"?t.nom:-t.nom;
      r.push([e.nama,e.posisi,t.void?"":++n,t.tgl,t.rin,t.tipe==="kasbon"?t.nom:"",t.tipe==="potongan"?t.nom:"",t.void?"":run,t.void?"Dibatalkan":"Aktif"])})});
  var csv="\ufeff"+r.map(function(x){return x.map(csvCell).join(",")}).join("\r\n");
  try{if(!dl&&window.claude)dl=await claude.use("downloads")}catch(e){}
  if(dl){try{await dl.save({filename:"kasbon-karyawan.csv",data:csv});return}catch(e){}}
  if(!window.claude){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="kasbon-karyawan.csv";document.body.appendChild(a);a.click();a.remove();return}catch(e){}}
  $("bk").style.display="";$("bt").value=csv;$("bm").textContent="Unduhan tidak tersedia. Salin teks CSV ini lalu tempel ke Excel atau Notepad.";
}
$("list").onclick=function(ev){var n=ev.target.closest(".emp");if(n){sel=n.dataset.id;editId=delId=null;render()}};
$("detail").onclick=function(ev){var b=ev.target.closest("[data-v]");if(!b)return;
  T.forEach(function(t){if(t.id===b.dataset.v)t.void=!t.void});save();render()};
$("q").oninput=$("fs").onchange=render;
$("exp").onclick=function(){exportCsv()};
$("addEmp").onclick=function(){
  var n=$("nm").value.trim(),m=$("m1");if(!n){m.textContent="Nama wajib diisi.";return}
  var e={id:uid(),nama:n,posisi:$("ps").value.trim()};E.push(e);sel=e.id;
  $("nm").value=$("ps").value="";m.textContent="";save();render()};
$("bkb").onclick=function(){$("bk").style.display="";$("bt").value=JSON.stringify({E:E,T:T});$("bm").textContent=""};
$("bcl").onclick=function(){$("bk").style.display="none"};
$("bres").onclick=function(){try{var d=JSON.parse($("bt").value);if(!d.E||!d.T)throw 0;E=d.E;T=d.T;sel=null;save();render();$("bk").style.display="none"}catch(e){$("bm").textContent="Teks cadangan tidak valid."}};
document.addEventListener("click",function(ev){var m=$("menu");if(m&&!ev.target.closest(".mw"))m.hidden=true});
render();
</script>
</body>
</html>
